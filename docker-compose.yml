services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vacancy_radar
      POSTGRES_PASSWORD: vacancy_radar
      POSTGRES_DB: vacancy_radar
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacancy_radar"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://vacancy_radar:vacancy_radar@postgres:5432/vacancy_radar?sslmode=disable"
      JWT_SECRET: "change-me-in-production"
      TELEGRAM_BOT_TOKEN: ""
      POLL_INTERVAL: "5m"
    ports:
      - "8080:8080"

volumes:
  pgdata:
